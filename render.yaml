services:
  - type: web
    name: mytube-proxy
    runtime: python
    plan: free
    repo: https://github.com/JoseAdolfo19/my-tube
    branch: main
    autoDeploy: true
    buildCommand: pip install -r tools/requirements.txt
    startCommand: python tools/audio_proxy.py
    healthCheckPath: /
    envSpecificDetails:
      pythonVersion: 3.12.7
    envVars:
      - key: PROXY_KEY
        sync: false
